<!DOCTYPE html>
<html lang="en">
<head>
  <title>Breaking News Portal</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Bootstrap 4.6 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-blue: #3b82f6;
      --accent-indigo: #6366f1;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    h1, h2, h3, h4, h5, h6, .brand-font {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
    }

    /* Navbar styling */
    .custom-navbar {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 1.5rem;
    }

    .brand-logo {
      font-size: 1.4rem;
      color: #fff;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-decoration: none !important;
    }

    .brand-logo i {
      color: var(--accent-red);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Modern Glass Card */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .glass-card:hover {
      box-shadow: 0 15px 35px rgba(59, 130, 246, 0.15);
    }

    /* Form Controls */
    .form-control, .custom-file-label {
      background-color: rgba(15, 23, 42, 0.6) !important;
      border: 1px solid var(--border-color) !important;
      color: #fff !important;
      border-radius: 10px !important;
      padding: 0.75rem 1rem !important;
      height: auto !important;
    }

    .form-control:focus {
      border-color: var(--accent-blue) !important;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;
    }

    .custom-file-label::after {
      background-color: #334155 !important;
      color: #fff !important;
      border-left: 1px solid var(--border-color) !important;
      border-radius: 0 10px 10px 0 !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
    }

    /* Buttons */
    .btn-gradient-primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
      color: #fff;
      border: none;
      font-weight: 600;
      border-radius: 10px;
      padding: 0.75rem 1.5rem;
      transition: all 0.2s ease;
    }

    .btn-gradient-primary:hover {
      opacity: 0.92;
      transform: translateY(-2px);
      color: #fff;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }

    .btn-dark-pill {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-weight: 500;
    }

    .btn-dark-pill:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* Badge & Countdown */
    .badge-live {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 20px;
      padding: 0.4rem 0.8rem;
      font-weight: 600;
    }

    .badge-timer {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 20px;
      padding: 0.4rem 0.8rem;
    }

    .media-container img, .media-container video {
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <!-- Global Navigation Header -->
  <nav class="navbar navbar-expand-lg custom-navbar mb-4">
    <div class="container">
      <a class="brand-logo" href="/">
        <i class="fa-solid fa-circle-dot mr-2"></i>BREAKING<span class="text-primary">NEWS</span>
      </a>

      <div class="ml-auto d-flex align-items-center">
        {% if session.get('user_id') %}
          <span class="text-muted mr-3 d-none d-sm-inline">
            <i class="fa-solid fa-user-circle mr-1 text-primary"></i> <strong>{{ session.get('username') }}</strong>
            <span class="badge badge-secondary ml-1">{{ session.get('role') | uppercase if session.get('role') else '' }}</span>
          </span>
          <a href="/logout" class="btn btn-sm btn-dark-pill px-3">
            <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
          </a>
        {% else %}
          <a href="/login" class="btn btn-sm btn-dark-pill px-3 mr-2">Login</a>
          <a href="/register" class="btn btn-sm btn-gradient-primary px-3">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
